name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Set up Java 17 (Required for Android Gradle)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Install Flet CLI
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      # 5. Accept Android SDK Licenses
      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      # 6. Build APK with verbose output
      - name: Build APK
        run: |
          flet build apk --verbose

      # 7. Upload APK Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk